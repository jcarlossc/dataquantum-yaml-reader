[project]
name = "dataquantum-yaml-reader"
version = "0.2.0"
description = "Python package for reading YAML files."
authors = [
    {name = "jcarlossc",email = "jcarlossc1977@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "types-pyyaml (>=6.0.12.20260906,<7.0.0.0)"
]

[tool.poetry]
packages = [{include = "dataquantum_yaml_reader", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "mypy (>=2.4.0,<3.0.0)",
    "ruff (>=0.17.1,<0.18.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "taskipy (>=1.14.1,<2.0.0)",
    "pre-commit (>=4.7.0,<5.0.0)"
]

[tool.taskipy.tasks]
pytest = "poetry run pytest ."
covhtml = "poetry run pytest --cov=dataquantum_reader_yaml --cov-report=html"
covcmd = "poetry run pytest --cov=dataquantum_reader_yaml --cov-report=term-missing"
format = "poetry run ruff format ."
lint = "poetry run ruff check ."
mypy = "poetry run mypy ."
check = "poetry run ruff format --check ."
precommit = "poetry run pre-commit run --all-files"
fix = "poetry run ruff check . --fix"
